<svg xmlns="http://www.w3.org/2000/svg" width="860" height="362" viewBox="0 0 860 362" role="img" aria-label="neofetch for kav: KavOS, Shropshire UK, Python TypeScript Rust SQL, into software architecture, technical solutions and web design, shipping whosup, KavOS and sundial">
<style>
text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:15px;white-space:pre}
.fg{fill:#9ef09e}.acc{fill:#4dff4d;font-weight:700}.dim{fill:#5c9a5c}
.type{animation:type .9s steps(8,end) .3s both}@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.ln{opacity:0;animation:in .25s ease-out forwards}@keyframes in{to{opacity:1}}
.cur{animation:blink 1.1s steps(2,jump-none) infinite}@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.type,.ln{animation:none;opacity:1;clip-path:none}.cur{animation:none}}
</style>
